[project]
name = "tmux-fleet"
version = "0.2.0"
description = "A smart tool for tmux fleets: observe every session on a machine, and — only under explicit per-invocation confirmation — type into one or start one. Deterministic paths run with nothing configured; smart paths (triage, interpret) bring model-backed judgment through the embedded amplifier-agent engine."
readme = "README.md"
# amplifier-agent (the embedded engine) requires >=3.12; the floor is set to
# 3.13 to match the runtime the engine's own integration story validates on.
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # tmux-kit is the PLUMBING (sockets, spawning, capture, input, the
    # isolated-server test harness). A DEPENDENCY, never vendored. Pinned to a
    # RELEASED floor from PyPI (>=0.4), NOT a git commit -- application judgment
    # (harness classification, triage, interpretation) lives here; mechanism
    # improvements flow upstream as PRs. Harness classification was re-homed
    # into this library (tmux_kit.labels was deleted upstream in 0.3.4 as app
    # policy) -- see tmux_fleet/harness.py.
    "tmux-kit>=0.4",
    # amplifier-agent is the AI substrate, EMBEDDED (VISION section 3): the
    # smart verbs import its engine LIBRARY (amplifier_agent_lib) in-process and
    # take a single turn -- no CLI subprocess, no wrapper SDK, no PATH-resolved
    # binary. It is a REGULAR dependency now (an install-story change from the
    # 0.1.x SDK-spawn model), fetched by git URL because it is not on PyPI. The
    # engine ships NO provider SDK of its own and carries NO credentials: a
    # provider SDK arrives via an install extra below (e.g. `tmux-fleet[anthropic]`)
    # and provider keys arrive from the caller's environment at runtime. The
    # engine is imported LAZILY by the smart verbs only -- deterministic verbs
    # and --help never touch it (importing amplifier_agent_lib mutates
    # os.environ), so the tool still loads and runs its deterministic paths with
    # nothing configured. See tmux_fleet/agent.py.
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent",
    # SMART_TOOL.md frontmatter is YAML; the manifest accessor parses the copy
    # built into the tool. A tiny, ubiquitous, pure-Python dependency.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Provider SDKs are OPTIONAL EXTRAS, not core dependencies: the engine
# dynamically imports a provider's SDK only when a smart verb actually runs a
# turn through that provider. Install the extra matching the provider whose
# credentials you supply -- e.g. `pip install "tmux-fleet[anthropic]"` (or
# `uv add "tmux-fleet[anthropic]"`). Without the matching extra a smart verb
# refuses loudly, naming the extra to install; the deterministic verbs never
# need any of these.
anthropic = ["anthropic"]
openai = ["openai"]

[project.scripts]
tmux-fleet = "tmux_fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# amplifier-agent is declared as a direct git reference (it is not on PyPI).
# hatchling rejects direct references in project.dependencies unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tmux_fleet"]

[tool.pytest.ini_options]
# amplifier-agent pulls in amplifier-core, whose pytest plugin
# ("amplifier_module") auto-registers via a pytest11 entry point and imports
# pytest_asyncio at load time -- which this suite neither ships nor needs.
# Disable that plugin so the suite runs on nothing but pytest itself.
addopts = "-p no:amplifier_module"
testpaths = ["tests"]
