[project]
name = "tmux-fleet"
version = "0.3.1"
description = "A smart tool for tmux fleets: observe every session on a machine, and — only under explicit per-invocation confirmation — type into one or start one. Deterministic paths run with nothing configured; smart paths (triage, interpret) use the embedded amplifier-agent public Python binding."
readme = "README.md"
# amplifier-agent (the embedded engine) requires >=3.12; the floor is set to
# 3.13 to match the runtime the engine's own integration story validates on.
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # tmux-kit is the PLUMBING (sockets, spawning, capture, input, the
    # isolated-server test harness). A DEPENDENCY, never vendored. Pinned to a
    # floor supporting native buffered paste (>=0.8.0), NOT a git commit -- application judgment
    # (harness classification, triage, interpretation) lives here; mechanism
    # improvements flow upstream as PRs. Harness classification was re-homed
    # into this library (tmux_kit.labels was deleted upstream in 0.3.4 as app
    # policy) -- see tmux_fleet/harness.py.
    "tmux-kit>=0.8.0",
    # Public binding only, imported lazily in-process. The released SDK owns
    # engine/core/foundation/provider pins; credentials remain caller-env-only.
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@v0.22.0#subdirectory=packages/python",
    # SMART_TOOL.md frontmatter is YAML; the manifest accessor parses the copy
    # built into the tool. A tiny, ubiquitous, pure-Python dependency.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.50"]
mcp = ["mcp>=2.2,<3"]
# Compatibility aliases: SDK now supplies these provider packages transitively.
anthropic = []
openai = []

[project.urls]
Repository = "https://github.com/microsoft/amplifier-smart-tool-tmux"

[project.scripts]
tmux-fleet = "tmux_fleet.cli:main"
tmux-fleet-terminal = "tmux_fleet.terminal_cli:main"
tmux-fleet-mcp = "tmux_fleet.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# amplifier-agent is declared as a direct git reference (it is not on PyPI).
# hatchling rejects direct references in project.dependencies unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tmux_fleet"]

[tool.pytest.ini_options]
# amplifier-agent pulls in amplifier-core, whose pytest plugin
# ("amplifier_module") auto-registers via a pytest11 entry point and imports
# pytest_asyncio at load time -- which this suite neither ships nor needs.
# Disable that plugin so the suite runs on nothing but pytest itself.
addopts = "-p no:amplifier_module"
testpaths = ["tests"]
