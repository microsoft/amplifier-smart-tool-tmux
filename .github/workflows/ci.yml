name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-conform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install tmux (the tool is a tmux client; deterministic verbs need it)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Tool test suite
        run: uv run --with pytest pytest tests/ -q

      # Steering enforcement: run the canonical conformance kit -- it belongs to
      # the spec repo and is never vendored here -- against the tool AS IT SHIPS.
      # Clone the kit outside the checkout, stage the distribution (excluding the
      # dev harness and test suite, which are not part of it), build a wheel from
      # that staged source, install the wheel into a fresh venv, then run the kit.
      #
      # `uv run --no-project` starts the kit from the dependencies it declares in
      # its own inline script metadata. Running it under a bare interpreter would
      # instead borrow whatever happens to be importable from the environment on
      # PATH, coupling the kit's dependency set to this tool's.
      - name: Conformance kit against this tool
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/amplifier-smart-tools \
            "$RUNNER_TEMP/amplifier-smart-tools"
          STAGE="$(mktemp -d)"
          rsync -a \
            --exclude='.git/' --exclude='tests/' \
            --exclude='.venv/' --exclude='.cikit/' --exclude='__pycache__/' \
            ./ "$STAGE/"
          DIST="$(mktemp -d)"
          (
            cd "$STAGE"
            uv build --wheel --out-dir "$DIST"
          )
          uv venv .cikit
          uv pip install --python .cikit/bin/python "$DIST"/*.whl
          export PATH="$PWD/.cikit/bin:$PATH"
          uv run --no-project \
            "$RUNNER_TEMP/amplifier-smart-tools/conformance/run.py" \
            "$STAGE" --timeout 60
