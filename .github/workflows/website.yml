name: Website

on:
  pull_request:
    paths: ['site/**', 'docs/images/**', 'tests/test_website.py', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'tests/test_website.py', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main to GitHub Pages if configured (other refs validate only)
        type: boolean
        default: false
      family_owner:
        description: Owner of the overview and catalog sites (robotdad for fork previews)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      configured: ${{ steps.pages.outputs.configured || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install website build dependencies
        run: python -m pip install -r site/requirements.txt pytest PyYAML
      - name: Build website
        env:
          FAMILY_OWNER: ${{ inputs.family_owner || 'microsoft' }}
        run: python site/theme/build.py --family-owner "$FAMILY_OWNER"
      - name: Test website
        run: python -m pytest tests/test_website.py -q
      - name: Check Pages readiness
        id: pages
        if: >-
          github.repository == 'microsoft/amplifier-smart-tool-tmux' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          configured = False
          try:
              with urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise SystemExit(f"Pages readiness probe failed (HTTP {response.status}).")
                  payload = json.load(response)
              configured = payload.get("build_type") == "workflow"
              if not configured:
                  print("::notice::Pages build_type is not workflow; publication skipped.")
          except HTTPError as error:
              if error.code == 404:
                  print("::notice::Pages not configured; publication skipped.")
              elif error.code == 403:
                  print("::notice::Pages permission unknown; publication skipped.")
              else:
                  raise SystemExit(f"Pages readiness probe failed (HTTP {error.code}).")
          except (URLError, TimeoutError):
              raise SystemExit("Pages readiness probe failed (network/timeout).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"configured={str(configured).lower()}\n")
          print(f"Pages readiness: configured={str(configured).lower()}")
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: artifact
        if: >-
          steps.pages.outputs.configured == 'true' &&
          github.repository == 'microsoft/amplifier-smart-tool-tmux' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        with:
          path: _site

  deploy:
    if: >-
      needs.build.outputs.configured == 'true' &&
      github.repository == 'microsoft/amplifier-smart-tool-tmux' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
